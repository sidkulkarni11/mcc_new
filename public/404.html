<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mindopiia Counselling Center</title>

  <script>
    // Redirect all 404s to index.html while keeping the route
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;

    // Store the full path in sessionStorage
    sessionStorage.redirect = path + search + hash;

    // Redirect to root
    window.location.replace("/");
  </script>
</head>

<body></body>
</html>
